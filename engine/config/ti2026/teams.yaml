# TI 2026 participants: 7 direct invites + 9 regional qualifier winners.
#
# Cross-checked 2026-07-31 against OpenDota qualifier match data (leagues
# 19890-19894) and /teams/{id}/players. Several orgs compete under a different
# name than the one below -- those aliases are pinned in config/overrides.yaml,
# which is where team_ids live.
#
# Still worth your own check before locking picks: rosters can change up to the
# deadline, and role labels (soft vs hard support especially) are editorial --
# replay parsing cannot tell the two apart. Run `python -m scripts.resolve_ids`
# after any edit.
# Extra OpenDota team_ids that are the same org playing under another banner.
# Keyed by id because that is what a match row carries.
#
# Iron Wing (10150413) is the team at TI 2026 -- that is the name on the client
# bracket and the id on every game they played here. The same five players spent
# the qualifier season on the "1w" id (10182357), so that id is folded in below
# to keep their pre-TI results attached to them. Verified 2026-08-18 against the
# account_ids in both sets of games.
also_team_ids:
  10182357: "Iron Wing"
  # Found 2026-08-29 by scripts.publish's orphan-id gate, not by hand: these ids
  # carry games played by the configured five under a second banner, so without
  # them those results are attributed to a phantom team and the real one is
  # rated on what is left. Same failure as Iron Wing, caught before it shipped.
  9824702: "PARIVISION"    # OpenDota "PVISION" (48-27), 55 sampled games
  10182299: "L1GA TEAM"    # OpenDota "L1 TEAM" (1-9), 24 sampled games

verified: true
# WHEN, not just whether. A roster is the most perishable thing in this config,
# and `verified: true` alone has no shelf life -- squads change between events,
# stand-ins appear between stages, orgs disband. scripts/gates.py refuses a
# roster that has aged out, and refuses a Main Event run whose roster was last
# checked before the Group Stage ended.
verified_utc: "2026-07-31T00:00:00Z"
source: "OpenDota qualifier leagues 19890-19894 + /teams/{id}/players, 2026-07-31"

