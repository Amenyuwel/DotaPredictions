# Valve's per-hero appearance tags, extracted from the Dota 2 client's
# scripts/npc/npc_heroes.txt (inside pak01_dir.vpk) by
# `python -m scripts.extract_hero_adjectives`. DO NOT HAND-EDIT.
#
# These are the ground truth behind the coach-title PREFIXES: Cerulean
# pays on a blue hero, Royal on a purple one, Heroic on a caped or masked
# one. The mapping is published nowhere else -- not on OpenDota, not on
# any community site -- but the client ships it.
#
# Heroes carry more than one tag: Sven is Blue AND Red, Muerta is Blue AND
# Green, Abaddon is Blue AND Purple. A prefix fires if ANY of its tags
# match, so the categories overlap and do not sum to the hero pool.
#
# Re-run after any patch that adds a hero.
source: npc_heroes.txt Adjectives block, Dota 2 client
