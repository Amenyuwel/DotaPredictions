# The 16 teams and their five players each.
#
# `verified` stays false until you have checked every roster against the
# client or a broadcast -- scripts/gates.py refuses to publish while it is
# false, and a stale roster is this project's most expensive failure: it
# produces a confident wrong number and no error at all.
#
# Fill these by hand, or run `python -m scripts.discover_rosters` once the
# qualifiers have finished and their league ids are in tournament.yaml.
#
# `verified_utc` is the day you ACTUALLY checked, and it is not optional:
# gates.roster_freshness refuses a roster with no date, one older than
# --max-roster-age, and -- for a Main Event run -- one last checked before
# the group stage locked. Backdating it to make a publish go through is
# the one edit here that silently breaks the model.

