# Manual pins for anything the resolver cannot get right on its own.
# Overrides always win over automatic resolution.
#
# Find an account_id at https://www.opendota.com/players/<account_id>
# and a team_id at https://www.opendota.com/teams/<team_id>.
#
# All 16 team_ids are pinned deliberately. Org names are ambiguous on OpenDota
# in three separate ways and each one silently poisons the roster lookup:
#   * rebrands      - BetBoom competes as "BoomBoys", Iron Wing spent the
#                     season as "1w",
#                     PARIVISION as "TEAM VISION", L1GA as "HULIGANI"
#   * recycled ids  - "Aurora Gaming" and "Nigma Galaxy" each map to several
#                     team_ids from different eras, most carrying dead rosters
#   * name reuse    - the LGD Gaming at TI 2026 is the South American squad
#                     (ex-HEROIC), not Chinese PSG.LGD
# Verified 2026-07-31 against qualifier match data and /teams/{id}/players.

teams:
  "Aurora Gaming": 9467224
  "BetBoom Team": 8255888      # competes as "BoomBoys"
  "Team Falcons": 9247354
  "Team Liquid": 2163
  "Iron Wing": 10150413        # season played on the "1w" id 10182357,
                               # which config/teams.yaml folds in
  "Xtreme Gaming": 8261500
  "Team Yandex": 9823272
  "Vici Gaming": 726228
  "Team Resilience": 5017210
  "LGD Gaming": 10150538       # South American squad, NOT Chinese PSG.LGD
  "OG": 2586976
